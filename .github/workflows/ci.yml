name: backend-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The lifecycle suite uses a deterministic fare provider. The real ORS
      # smoke test is opt-in via RUN_LIVE_ORS=true and stays out of CI.
      - run: npm test
